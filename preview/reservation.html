<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWS2 HUD · 交互预览</title><style>/* Original text-only layout. Reference: cs2kz !o's persistent categories and right pane.
   Panorama uses a 1080-high HUD canvas, scaled by CS2. Only map pickers use optional packaged map screenshots. */
.root, #sw_root { width: 100%; height: 100%; }
.root { z-index: 100; }
.hidden { display: none !important; }
Label { font-family: "Stratum2", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; color: #e4e8eb; }
.menu-box {
    width: 980px; height: 660px;
      display: flex; flex-direction: column;
    background-color: #111518fc; border: 1px solid #ffffff1c; border-radius: 6px;
    box-shadow: 0 14px 64px #000000b0;
    animation-name: panel-in; animation-duration: 0.16s; animation-timing-function: ease-out;
}
.window-header {
    width: 100%; height: 64px; padding: 0px 24px; display: flex; flex-direction: row;
    border-bottom: 1px solid #ffffff14;
}
.window-title { flex: 1; min-width: 0; width: auto;  font-size: 19px; font-weight: bold; letter-spacing: 1px; }
.operator { max-width: 220px;  margin-right: 20px; color: #89949d; font-size: 13px; white-space: nowrap; text-overflow: ellipsis; }
.close-btn { width: 60px; height: 30px;  border: 1px solid #ffffff1c; border-radius: 3px; }
.close-btn Label {   color: #a6afb6; font-size: 13px; white-space: nowrap; }
.close-btn:hover { background-color: #ffffff0c; }
.close-btn:hover Label { color: #ffffff; }
.panes { width: 100%; flex: 1; min-height: 0; height: auto; display: flex; flex-direction: row; }
.sidebar-nav {
    width: 214px; height: 100%; padding: 26px 14px 22px 14px;
    display: flex; flex-direction: column; border-right: 1px solid #ffffff14; background-color: #080b0e38;
}
.nav-heading { margin: 0px 12px 16px 12px; font-size: 11px; color: #707d87; letter-spacing: 1px; }
.categories { width: 100%; flex: 1; min-height: 0; height: auto; display: flex; flex-direction: column; }
.category {
    width: 100%; height: 44px; margin-bottom: 6px; padding: 0px 12px;
    border-left: 2px solid #ffffff00; border-radius: 3px;
    background-color: #ffffff00; transition-property: background-color; transition-duration: 0.08s;
}
.category Label { width: 100%;  font-size: 16px; color: #a0abb3; white-space: nowrap; text-overflow: ellipsis; }
.category:hover { background-color: #ffffff08; }
.category.selected { border-left: 2px solid #98c8bc; background-color: #ffffff0e; }
.category.selected Label { color: #e7f1ee; font-weight: bold; }
.category.disabled { opacity: 0.35; }
.category.disabled:hover { background-color: #ffffff00; }
.sidebar-hint { width: 100%; padding: 0px 12px; color: #626f79; font-size: 11px; line-height: 19px; }
.workspace { flex: 1; min-width: 0; width: auto; height: 100%; display: flex; flex-direction: column; }
.content { width: 100%; flex: 1; min-height: 0; height: auto; padding: 24px 28px 12px 28px; display: flex; flex-direction: column; }
.breadcrumb { width: 100%; height: 24px; color: #75838f; font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.heading { width: 100%; height: 43px; display: flex; flex-direction: row; }
.menu-title { flex: 1; min-width: 0; width: auto;  font-size: 25px; font-weight: bold; white-space: nowrap; text-overflow: ellipsis; }
.count-badge {  margin-left: 14px; color: #82918e; font-size: 12px; }
.menu-comment { width: 100%; height: 52px; padding-top: 6px; }
#sw_comment_text { width: 100%; max-height: 44px; font-size: 13px; line-height: 21px; color: #89969f; text-overflow: ellipsis; }
.section-label { width: 100%; height: 28px; padding-top: 4px; color: #6f7b85; font-size: 11px; letter-spacing: 1px; border-bottom: 1px solid #ffffff10; }
.menu-items { width: 100%; flex: 1; min-height: 0; height: auto; padding-top: 8px; display: flex; flex-direction: column; }
.item {
    width: 100%; height: 61px; margin-bottom: 3px; padding: 0px 12px;
    display: flex; flex-direction: row; border-radius: 3px; background-color: #ffffff00;
    transition-property: background-color; transition-duration: 0.08s;
}
.item:hover { background-color: #ffffff0b; }
.item:active { background-color: #ffffff13; }
.item-body { flex: 1; min-width: 0; width: auto;  display: flex; flex-direction: column; }
.item-text { width: 100%; font-size: 16px; color: #dde3e7; white-space: nowrap; text-overflow: ellipsis; }
.item-comment { width: 100%; margin-top: 5px; font-size: 12px; color: #798a97; white-space: nowrap; text-overflow: ellipsis; }
.item-action {  margin-left: 18px; color: #8ba59d; font-size: 12px; }
.item.disabled { opacity: 0.35; }
.item.disabled:hover { background-color: #ffffff00; }
.item.destructive .item-text, .item.destructive .item-action { color: #e29b9e; }
.item.destructive:hover { background-color: #e29b9e0b; }
.confirmation #sw_comment_text { color: #c7b9a5; }
.confirmation .item { height: 72px; border: 1px solid #ffffff13; margin-top: 8px; }
.menu-footer { width: 100%; height: 60px; padding: 0px 28px; display: flex; flex-direction: row; border-top: 1px solid #ffffff10; }
.nav-btn, .page-btn { height: 30px;  padding: 0px 12px; border: 1px solid #ffffff1a; border-radius: 3px; }
.nav-btn { min-width: 64px; margin-right: 8px; }
.page-btn { width: 72px; }
.nav-btn Label, .page-btn Label {   font-size: 12px; color: #a5b0b8; white-space: nowrap; }
.nav-btn:hover, .page-btn:hover { background-color: #ffffff0b; }
.page-btn.disabled { opacity: 0.25; }
.page-btn.disabled:hover { background-color: #ffffff00; }
.page-text { width: 56px;  text-align: center; font-size: 12px; color: #8e9ba5; }
.footer-text { flex: 1; min-width: 0; width: auto;  margin-right: 12px; font-size: 11px; color: #657580; white-space: nowrap; text-overflow: ellipsis; }
.sidebar-empty .menu-items { display: none !important; }
#sw_root.menu-refresh-a .menu-items { animation-name: items-in-a; animation-duration: 0.12s; animation-timing-function: ease-out; }
#sw_root.menu-refresh-b .menu-items { animation-name: items-in-b; animation-duration: 0.12s; animation-timing-function: ease-out; }
@keyframes panel-in {
    0% { opacity: 0; transform: translate3d(0px, 6px, 0px); }
    100% { opacity: 1; transform: translate3d(0px, 0px, 0px); }
}
@keyframes items-in-a {
    0% { opacity: 0.4; }
    100% { opacity: 1; }
}
@keyframes items-in-b {
    0% { opacity: 0.4; }
    100% { opacity: 1; }
}

/* Map reservations share the window but do not show the admin navigation. */
.item.map-row { height: 78px; padding: 0px 10px; }
.map-thumbnail { width: 112px; height: 63px; margin-right: 18px;  background-color: #1b2227; border-radius: 3px; overflow: clip; }
.no-image { width: 100%;  text-align: center; color: #657580; font-size: 11px; }
.map-artwork { width: 100%; height: 100%; background-size: cover; background-position: center; background-repeat: no-repeat; }
.map-tiers { width: 300px;  margin-left: 20px; display: flex; flex-direction: column; }
.map-tier-pair { width: 100%; display: flex; flex-direction: row; }
.map-tier { flex: 1; min-width: 0; width: auto; margin: 2px 4px; padding: 3px 8px; border: 1px solid #98c8bc30; border-radius: 3px; color: #a8c4ba; font-size: 12px; text-align: center; white-space: nowrap; }

.sidebar.map-picker .menu-box { width: 1160px; }

  const row=rows[i], el=$('sw_item'+i); el.className='item'+(!row?' hidden':'')+(row?.danger?' destructive':'')+(row?.disabled?' disabled':'')+(row?.map?' map-row':''); el.disabled=!row||!!row.disabled;
  $('sw_item'+i+'_thumbnail').classList.toggle('hidden',!row?.map); $('sw_item'+i+'_tiers').classList.toggle('hidden',!row?.map);
  $('sw_item'+i+'_artwork').className='map-artwork '+(thumbnailClasses[row?.workshopId]||'');
  for (const [suffix,key,label] of [['ckz_nub_tier','ckzNub','CKZ NUB'],['ckz_pro_tier','ckzPro','CKZ PRO'],['vnl_nub_tier','vnlNub','VNL NUB'],['vnl_pro_tier','vnlPro','VNL PRO']]) { text('sw_item'+i+'_'+suffix,row?.[key]?label+' 等级 '+row[key]:label+' 等级未知'); } text('sw_item'+i+'_no_image','暂无图片');
  if(!row) continue;
  text('sw_item'+i+'_text',row.name); text('sw_item'+i+'_comment',row.comment); text('sw_item'+i+'_action',row.disabled?'不可用':'选择');
  $('sw_item'+i+'_comment').classList.toggle('hidden',!row.comment); el.onclick=row.action;
 }
 $('sw_home').classList.add('hidden'); $('sw_back').classList.toggle('hidden',stack.length<2);
 $('sw_prev').disabled=frame.page===0; $('sw_next').disabled=frame.page===pages-1;
 $('sw_prev').classList.toggle('disabled',$('sw_prev').disabled); $('sw_next').classList.toggle('disabled',$('sw_next').disabled);
}
$('sw_prev').onclick=()=>{stack.at(-1).page--;render();}; $('sw_next').onclick=()=>{stack.at(-1).page++;render();};
$('sw_back').onclick=()=>{stack.pop();render();};
$('sw_close').onclick=()=>{$('sw_root').classList.add('hidden');$('reopen').style.display='block';};
$('reopen').onclick=()=>{$('reopen').style.display='none';home();};
function resize(){const scale=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='scale('+scale+')';$('stage').style.left=(innerWidth-1920*scale)/2+'px';$('stage').style.top=(innerHeight-1080*scale)/2+'px';}
window.addEventListener('resize',resize);home();resize();

if(reservationMode) { document.querySelector('.preview-note').textContent='地图预定预览 · 等级为示例数据 · 游戏内使用 !yd 打开'; text('reopen','重新打开 !yd'); }
</script></html>
